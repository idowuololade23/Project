<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InsightLens Page Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="brand"><span class="brand-mark">i</span><span>insight<strong>lens</strong></span></div>
    <h1>Bring this page into focus.</h1>
    <p>Capture the readable text in the active tab and send it to your local InsightLens app.</p>
    <button id="analyze" type="button">Analyze this page <span aria-hidden="true">↗</span></button>
    <p id="status" role="status" aria-live="polite">The page is read only after you click.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
